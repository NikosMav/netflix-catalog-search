name: Ranking explorer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_explorer.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/explorer
      - id: deploy
        uses: actions/deploy-pages@v4
